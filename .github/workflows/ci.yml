name: PhishShield CI/CD Pipeline

on:
  push:
    branches: [ main, master, migracion-arquitectura-espanol ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Lint, Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Run Test Suite (Angular + Node Express)
        run: npm run test:all

      - name: Security Audit (NPM Audit)
        run: npm audit --audit-level=high

      - name: Production Build (Angular)
        run: npm run build
