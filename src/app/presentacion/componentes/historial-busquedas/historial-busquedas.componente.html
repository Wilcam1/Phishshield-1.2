<section class="tarjeta-historial superficie-cristal" role="region" aria-label="Historial de análisis recientes">
  <header class="encabezado-historial">
    <div class="izquierda-historial">
      <span class="icono-reloj" aria-hidden="true">📝</span>
      <h3 class="titulo-historial">Búsquedas Recientes</h3>
    </div>

    @if (historial.length > 0) {
      <button
        type="button"
        class="boton-limpiar-historial"
        (click)="limpiar()"
        title="Limpiar historial local"
        aria-label="Limpiar historial de búsquedas"
      >
        <span>🗑️ Limpiar</span>
      </button>
    }
  </header>

  <div class="cuerpo-historial">
    @if (historial.length === 0) {
      <p class="estado-vacio">Aún no hay análisis registrados en tu sesión actual.</p>
    } @else {
      <ul class="lista-entradas">
        @for (item of historial; track item.url) {
          <li class="item-entrada">
            <button
              type="button"
              class="boton-item-url"
              (click)="seleccionar(item.url)"
              [title]="'Reanalizar ' + item.url"
            >
              <span class="url-texto texto-mono">{{ item.url }}</span>
              <div class="meta-item">
                <span class="insignia-pildora" [ngClass]="item.riesgo | riesgoColor">
                  {{ item.riesgo | uppercase }}
                </span>
                <span class="fecha-item">{{ item.fecha | formatoFecha:'hora' }}</span>
              </div>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</section>
