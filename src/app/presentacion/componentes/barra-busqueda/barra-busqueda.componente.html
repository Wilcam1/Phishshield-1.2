<div class="contenedor-barra-busqueda superficie-nivel-2" role="search" aria-label="Analizador de URLs">
  <div
    class="campo-entrada-envoltorio"
    [class.con-formato-valido]="url && esFormatoValido"
    [class.con-foco-animado]="true"
  >
    <div class="borde-conico-foco" aria-hidden="true"></div>

    <span class="icono-enlace" [class.animando-pegado]="fuePegado()" aria-hidden="true">
      <app-icono nombre="enlace" [tamano]="18" />
    </span>

    <input
      type="url"
      class="entrada-url texto-mono"
      placeholder="https://ejemplo-banco.com/login?token=..."
      [(ngModel)]="url"
      (keydown)="alPresionarEnter($event)"
      (paste)="alPegar()"
      [disabled]="estaCargando"
      [appAtajoTeclado]="'k'"
      aria-label="URL a analizar para detección de phishing"
    />

    @if (url) {
      <button
        type="button"
        class="boton-limpiar"
        (click)="limpiar()"
        title="Limpiar campo"
        aria-label="Limpiar campo de texto"
      >
        <app-icono nombre="cerrar" [tamano]="16" />
      </button>
    } @else {
      <kbd class="insignia-atajo" title="Atajo: Presiona Ctrl+K para enfocar">Ctrl K</kbd>
    }
  </div>

  <div class="acciones-barra">
    <button
      type="button"
      class="boton-primario boton-analizar-magnetico"
      appMagnetico
      appLuzCursor
      (click)="emitirAnalisis()"
      [disabled]="!url || estaCargando"
      aria-live="polite"
    >
      @if (estaCargando) {
        <span class="indicador-giratorio" aria-hidden="true"></span>
        <span>Escaneando...</span>
      } @else {
        <app-icono nombre="lupa" [tamano]="18" />
        <span>Analizar</span>
      }
    </button>

    <button
      type="button"
      class="boton-secundario boton-alerta"
      appLuzCursor
      (click)="emitirReporte()"
      [disabled]="!url || estaCargando"
      title="Reportar esta URL como fraude a la comunidad"
    >
      <app-icono nombre="alerta" [tamano]="18" />
      <span>Reportar</span>
    </button>
  </div>
</div>
