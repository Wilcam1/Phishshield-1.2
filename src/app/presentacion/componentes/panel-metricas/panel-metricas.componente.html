<section class="tarjeta-metricas superficie-nivel-1" role="region" aria-label="Métricas en vivo de ciberseguridad">
  <header class="encabezado-metricas">
    <div class="izquierda-metricas">
      <div class="icono-grafico" aria-hidden="true">
        <app-icono nombre="servidor" [tamano]="20" />
      </div>
      <div>
        <h3 class="titulo-metricas">Estadísticas Forenses en Vivo</h3>
        <span class="subtitulo-metricas">Monitoreo y telemetría de inspecciones</span>
      </div>
    </div>

    <button
      type="button"
      class="boton-actualizar-metricas"
      (click)="actualizar()"
      title="Refrescar contadores"
      aria-label="Actualizar métricas forenses"
    >
      <app-icono nombre="refrescar" [tamano]="16" />
      <span>Actualizar</span>
    </button>
  </header>

  <div class="cuadricula-kpis">
    <button
      type="button"
      class="tarjeta-kpi kpi-total"
      appInclinacion3d
      appLuzCursor
      (click)="seleccionar('todas')"
      title="Explorar todas las URLs analizadas"
    >
      <span class="etiqueta-kpi">Total Analizado</span>
      <span class="valor-kpi numero-tabular">{{ totalAnalizadoAnimado() }}</span>
      <span class="pista-clic">
        <app-icono nombre="ojo" [tamano]="14" />
        <span>Explorar</span>
      </span>
    </button>

    <button
      type="button"
      class="tarjeta-kpi kpi-peligro"
      appInclinacion3d
      appLuzCursor
      (click)="seleccionar('alto')"
      title="Explorar amenazas confirmadas"
    >
      <span class="etiqueta-kpi">Riesgo Alto</span>
      <span class="valor-kpi numero-tabular">{{ riesgoAltoAnimado() }}</span>
      <span class="pista-clic">
        <app-icono nombre="ojo" [tamano]="14" />
        <span>Explorar</span>
      </span>
    </button>

    <button
      type="button"
      class="tarjeta-kpi kpi-advertencia"
      appInclinacion3d
      appLuzCursor
      (click)="seleccionar('medio')"
      title="Explorar sitios con advertencias"
    >
      <span class="etiqueta-kpi">Riesgo Medio</span>
      <span class="valor-kpi numero-tabular">{{ riesgoMedioAnimado() }}</span>
      <span class="pista-clic">
        <app-icono nombre="ojo" [tamano]="14" />
        <span>Explorar</span>
      </span>
    </button>

    <button
      type="button"
      class="tarjeta-kpi kpi-seguro"
      appInclinacion3d
      appLuzCursor
      (click)="seleccionar('bajo')"
      title="Explorar sitios legítimos"
    >
      <span class="etiqueta-kpi">Riesgo Bajo</span>
      <span class="valor-kpi numero-tabular">{{ riesgoBajoAnimado() }}</span>
      <span class="pista-clic">
        <app-icono nombre="ojo" [tamano]="14" />
        <span>Explorar</span>
      </span>
    </button>

    @if (modoAdmin) {
      <button
        type="button"
        class="tarjeta-kpi kpi-reportes"
        appInclinacion3d
        appLuzCursor
        (click)="seleccionar('reportes')"
        title="Explorar reportes de la comunidad"
      >
        <span class="etiqueta-kpi">Reportes Comunidad</span>
        <span class="valor-kpi numero-tabular">{{ reportesAnimado() }}</span>
        <span class="pista-clic">
          <app-icono nombre="ojo" [tamano]="14" />
          <span>Explorar</span>
        </span>
      </button>
    }
  </div>
</section>
