<section class="tarjeta-asistente superficie-cristal" role="region" aria-label="Asistente educativo inteligente">
  <header class="encabezado-asistente">
    <div class="identidad-asistente">
      <span class="icono-robot" aria-hidden="true">🤖</span>
      <div>
        <h4 class="titulo-asistente">Asistente Educativo con IA</h4>
        <span class="fuente-asistente">{{ asistente.fuente }}</span>
      </div>
    </div>
    <span class="etiqueta-vivo">✨ Explicación Forense</span>
  </header>

  <div class="cuerpo-asistente">
    <div class="resumen-texto" [innerHTML]="asistente.resumenExplicativo | markdownSeguro"></div>
  </div>

  @if (asistente.recomendacion) {
    <footer class="caja-recomendacion">
      <span class="icono-bombilla" aria-hidden="true">💡</span>
      <div class="contenido-recomendacion">
        <strong>Acción recomendada:</strong>
        <div class="texto-recomendacion" [innerHTML]="asistente.recomendacion | markdownSeguro"></div>
      </div>
    </footer>
  }
</section>
